[project]
name = "code-agent-cli"
version = "0.1.0"
description = "Terminal coding agent application"
requires-python = ">=3.12"
dependencies = [
    "code-agent-core",
    "code-agent-llm",
    "pydantic>=2.11,<3",
]

[tool.uv.sources]
code-agent-core = { workspace = true }
code-agent-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
code-agent = "code_agent.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]
