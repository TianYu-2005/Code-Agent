[project]
name = "code-agent-llm"
version = "0.1.0"
description = "Model provider boundary for Code Agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent_llm"]
