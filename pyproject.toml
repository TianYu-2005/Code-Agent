[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/code-agent-llm/src",
    "packages/code-agent-core/src",
    "packages/code-agent-cli/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov --cov-report=term-missing"
testpaths = ["packages"]

[tool.coverage.run]
branch = true
source = ["code_agent_llm", "code_agent_core", "code_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
